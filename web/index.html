<!doctype html>
<!-- ABOUTME: Web version of the CCC terminal screensaver, for a big screen mirrored from a phone. -->
<!-- ABOUTME: Event content lives in config.json, re-read every minute so edits land without touching the phone. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CCC Screen">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Claude Code Curious</title>
<style>
  :root { --u: 8px; --orange: rgb(215,119,87); --dim: rgb(128,128,128); --text: rgb(220,220,220); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    -webkit-text-size-adjust: 100%; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; cursor: none;
    background: #000 radial-gradient(ellipse 70% 55% at 50% 32%, rgba(215,119,87,0.07), rgba(0,0,0,0) 70%);
  }
  #fx { position: fixed; left: 0; top: 0; z-index: 0; pointer-events: none; }
  #stage {
    position: fixed; inset: 0; z-index: 1; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center;
    padding: max(calc(var(--u)*2.5), env(safe-area-inset-top)) max(calc(var(--u)*3), env(safe-area-inset-right))
             max(calc(var(--u)*3), env(safe-area-inset-bottom)) max(calc(var(--u)*3), env(safe-area-inset-left));
  }
  #top { width: 100%; display: flex; justify-content: space-between; align-items: flex-start; }
  .box {
    position: relative; border: max(1px, calc(var(--u)*0.22)) solid var(--orange);
    border-radius: calc(var(--u)*1.1); white-space: pre;
  }
  .box .lbl { position: absolute; top: -0.75em; left: 1.2em; padding: 0 0.5em; background: #000; color: var(--orange); }
  #welcome { font-size: calc(var(--u)*2.1); line-height: 1.35; padding: 0.55em 1.6em 0.55em 1em; }
  #welcome .star { color: var(--orange); }
  #welcome .muted { color: var(--dim); }
  #clock { font-size: calc(var(--u)*2.6); text-align: right; line-height: 1.25; color: var(--text); }
  #clock .day { display: block; font-size: 0.7em; color: var(--dim); }
  #logo { margin-top: calc(var(--u)*1.2); filter: drop-shadow(0 0 calc(var(--u)*1.4) rgba(255,160,110,0.35)); }
  #sub { margin-top: calc(var(--u)*2.4); font-size: calc(var(--u)*3); font-weight: 700; white-space: pre; }
  #spin { margin-top: calc(var(--u)*2); font-size: calc(var(--u)*2.4); white-space: pre; }
  #sg { color: var(--orange); display: inline-block; width: 1.2em; text-align: center; }
  #meta { color: rgb(100,100,100); }
  #lane { flex: 1; min-height: calc(var(--u)*8); width: 100%; }
  #bottom { display: flex; gap: calc(var(--u)*9); align-items: flex-start; justify-content: center; width: 100%; }
  #todos { font-size: calc(var(--u)*2.7); line-height: 1.32; white-space: pre; }
  #todos .th .dot { color: rgb(78,186,101); }
  #todos .th { font-weight: 700; }
  .row { color: rgb(200,200,200); }
  .row .el { color: var(--dim); }
  .row.done { color: rgb(105,105,105); }
  .row.done .tx { text-decoration: line-through; text-decoration-thickness: 0.06em; }
  .row.now { color: #fff; font-weight: 700; }
  .row.now .bx { color: var(--orange); }
  .row.now .tag { color: var(--orange); font-weight: 400; }
  #right { display: flex; flex-direction: column; gap: calc(var(--u)*2.2); padding-top: calc(var(--u)*1.2); }
  #wifi { font-size: calc(var(--u)*3); line-height: 1.45; padding: 0.7em 1.4em 0.55em 1.1em; }
  #wifi .k { color: var(--dim); font-size: 0.75em; }
  #wifi b { color: #fff; }
  #thanks { font-size: calc(var(--u)*1.9); color: var(--dim); white-space: pre; }
  #toast { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%); bottom: calc(var(--u)*1); font-size: calc(var(--u)*1.8);
           color: var(--dim); opacity: 0; transition: opacity .4s; white-space: pre; }
  #toast.on { opacity: 1; }
  #awake { position: fixed; z-index: 3; left: max(calc(var(--u)*3), env(safe-area-inset-left)); bottom: calc(var(--u)*1);
           font-size: calc(var(--u)*1.6); color: rgb(110,110,110); display: none; }
  #rotate { display: none; font-size: calc(var(--u)*3); color: var(--dim); margin-top: calc(var(--u)*4); }
  @media (orientation: portrait) { #rotate { display: block; } }
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="stage">
  <div id="top">
    <div class="box" id="welcome"></div>
    <div id="clock"><span id="hm">--:--</span></div>
  </div>
  <div id="rotate">↻ rotate for the big screen</div>
  <canvas id="logo"></canvas>
  <div id="sub"></div>
  <div id="spin"><span id="sg">✻</span> <span id="verb"></span> <span id="meta"></span></div>
  <div id="lane"></div>
  <div id="bottom">
    <div id="todos"></div>
    <div id="right">
      <div class="box" id="wifi"></div>
      <div id="thanks"></div>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="awake">tap once to keep the screen awake</div>
<!-- A tiny muted looping video: a playing video stops iOS auto-locking, as a backstop to the Wake Lock API -->
<video id="nosleep" src="nosleep.mp4" muted playsinline loop autoplay preload="auto"
  style="position:fixed;left:0;top:0;width:2px;height:2px;opacity:0.01;pointer-events:none;z-index:0"></video>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Defaults (overridden by config.json, which is re-read every 60s)
// ---------------------------------------------------------------------------
let CFG = {
  subtitle: "CODE CURIOUS", welcome: "Welcome to Claude Code Curious!", date_line: "", venue: "", host: "",
  wifi: { network: "", password: "" }, thanks: "", agenda: [], urgency_start_minutes_before_end: 40,
  go_home_messages: ["Time to go home!", "The pub is calling...", "git commit -m 'gone home'"],
  verbs: ["Reticulating splines...", "Compiling thoughts...", "Initializing curiosity..."],
};

// The CLAUDE block art and the Claude Code mascot, exactly as in screensaver.py
const TITLE = [
  "    ▄▄▄▄   ▄▄           ▄▄     ▄▄    ▄▄  ▄▄▄▄▄     ▄▄▄▄▄▄▄▄ ",
  "  ██▀▀▀▀█  ██          ████    ██    ██  ██▀▀▀██   ██▀▀▀▀▀▀ ",
  " ██▀       ██          ████    ██    ██  ██    ██  ██       ",
  " ██        ██         ██  ██   ██    ██  ██    ██  ███████  ",
  " ██▄       ██         ██████   ██    ██  ██    ██  ██       ",
  "  ██▄▄▄▄█  ██▄▄▄▄▄▄  ▄██  ██▄  ▀██▄▄██▀  ██▄▄▄██   ██▄▄▄▄▄▄ ",
  "    ▀▀▀▀   ▀▀▀▀▀▀▀▀  ▀▀    ▀▀    ▀▀▀▀    ▀▀▀▀▀     ▀▀▀▀▀▀▀▀",
];
// The CCC crab (Clawd sprite) and the big crab that peeks up from the bottom, as in screensaver.py on GitHub
const CRAB_BODY = [" ▐▛███▜▌ ", "▝▜█████▛▘"];
const CRAB_LEGS = ["  ▘▘ ▝▝  ", "  ▝▝ ▘▘  "];
const CRAB_W = 9;
const MAX_CRABS = 5;
const BIG_CRAB_OPEN = [
  "██████████████████████████████████████████████████",
  "██████████████████████████████████████████████████",
  "████████████      ██████████████      ████████████",
  "████████████      ██████████████      ████████████",
  "████████████      ██████████████      ████████████",
  "██████████████████████████████████████████████████",
  "██████████████████████████████████████████████████",
  "██████████████████████████████████████████████████",
];
const BIG_CRAB_W = 50, BIG_CRAB_H = BIG_CRAB_OPEN.length;
const BIG_CRAB_BLINK = Array(BIG_CRAB_H).fill("█".repeat(BIG_CRAB_W));

// Quadrant bits: 8 = top-left, 4 = top-right, 2 = bottom-left, 1 = bottom-right
const Q = {" ":0,"█":15,"▀":12,"▄":3,"▌":10,"▐":5,"▘":8,"▝":4,"▖":2,"▗":1,"▛":14,"▜":13,"▙":11,"▟":7,"▚":9,"▞":6};

const rgb = (a) => `rgb(${a[0]},${a[1]},${a[2]})`;
// xterm-256 WARM palette from the terminal version, in the same order
const WARM = [[215,135,95],[215,175,95],[215,175,135],[215,215,135],[215,215,175],[255,175,135],[255,175,175],
  [255,215,175],[255,215,215],[255,255,215],[255,135,95],[255,175,95],[215,135,135],[175,135,135],[175,175,135]]
  // ordered dark to light so the shimmer sweeps across the letters instead of speckling
  .sort((a, b) => (0.3 * a[0] + 0.59 * a[1] + 0.11 * a[2]) - (0.3 * b[0] + 0.59 * b[1] + 0.11 * b[2])).map(rgb);
const CRAB_COLOR = "rgb(255,135,0)";
// Accessories some crabs carry: ✦ lightbulb, ◎ magnifying glass, ? question
const ACCESSORIES = [null, null, null, ["✦", "rgb(255,255,0)"], ["✦", "rgb(255,255,0)"], ["◎", "rgb(208,208,208)"], ["?", "rgb(238,238,238)"]];
const GLOW = ["rgb(150,150,150)", "rgb(180,180,180)", "rgb(210,210,210)", "rgb(238,238,238)"];
const SPINNER = ["·", "✢", "✷", "✶", "✻", "✽", "✻", "✶", "✷", "✢"];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// ---------------------------------------------------------------------------
// Time (Europe/London, with ?t=HH:MM to rehearse a later moment)
// ---------------------------------------------------------------------------
const londonFmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/London", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
function londonMinutes() {
  const p = Object.fromEntries(londonFmt.formatToParts(new Date()).map((x) => [x.type, x.value]));
  return (+p.hour % 24) * 60 + +p.minute + +p.second / 60;
}
let offsetMin = 0;
const tParam = new URLSearchParams(location.search).get("t");
if (tParam && /^\d{1,2}:\d{2}$/.test(tParam)) {
  const [h, m] = tParam.split(":").map(Number);
  offsetMin = h * 60 + m - londonMinutes();
}
const nowMin = () => londonMinutes() + offsetMin;
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const fmtHM = (mins) => { const m = ((Math.floor(mins) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };

// ---------------------------------------------------------------------------
// Layout + sizing
// ---------------------------------------------------------------------------
let U = 8, S = 12, DPR = 1, cols = 0, rows = 0;
const fx = $("fx"), fxc = fx.getContext("2d");
const logo = $("logo"), lgc = logo.getContext("2d");
const LOGO_COLS = Math.max(...TITLE.map((l) => [...l].length));
let lane = { rowMin: 10, rowMax: 12 };

function layout() {
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  U = Math.min(h / 100, (w * 0.56) / 100);
  S = U * 1.5;                       // one terminal cell is S wide and 2S tall
  document.documentElement.style.setProperty("--u", U + "px");
  fx.width = Math.round(w * DPR); fx.height = Math.round(h * DPR);
  fx.style.width = w + "px"; fx.style.height = h + "px";
  logo.width = Math.round(LOGO_COLS * S * DPR); logo.height = Math.round(TITLE.length * 2 * S * DPR);
  logo.style.width = LOGO_COLS * S + "px"; logo.style.height = TITLE.length * 2 * S + "px";
  cols = Math.ceil(w / S); rows = Math.ceil(h / (2 * S));
  computeLane();
}
function computeLane() {
  const top = $("spin").getBoundingClientRect().bottom + U;
  const bottom = $("bottom").getBoundingClientRect().top;
  const ch = 2 * S;
  const rowMin = Math.ceil(top / ch);
  lane = { rowMin, rowMax: Math.max(rowMin, Math.floor(bottom / ch) - 3) };
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout, 300));

// Draw one terminal cell of block/quadrant characters, snapped to device pixels so cells join seamlessly
function fillCell(ctx, ch, x, y, w, h, color) {
  const b = Q[ch]; if (!b) return;
  ctx.fillStyle = color;
  const R = Math.round, xm = x + w / 2, ym = y + h / 2;
  const rect = (x0, y0, x1, y1) => ctx.fillRect(R(x0), R(y0), R(x1) - R(x0), R(y1) - R(y0));
  if (b & 8) rect(x, y, xm, ym);
  if (b & 4) rect(xm, y, x + w, ym);
  if (b & 2) rect(x, ym, xm, y + h);
  if (b & 1) rect(xm, ym, x + w, y + h);
}

// ---------------------------------------------------------------------------
// Static text (re-rendered whenever config changes)
// ---------------------------------------------------------------------------
let subChars = [];
function renderText() {
  const lines = [`<span class="star">✻</span> ${esc(CFG.welcome)}`, ""];
  if (CFG.date_line) lines.push("  " + esc(CFG.date_line));
  if (CFG.venue) lines.push("  " + esc(CFG.venue));
  if (CFG.host) lines.push(`  <span class="muted">${esc(CFG.host)}</span>`);
  $("welcome").innerHTML = lines.join("\n");

  const spaced = [...CFG.subtitle].join(" ");
  $("sub").innerHTML = [...spaced].map((c) => `<span>${c === " " ? " " : esc(c)}</span>`).join("");
  subChars = [...$("sub").children];

  const wf = CFG.wifi || {};
  const wifiOn = wf.network || wf.password;
  $("wifi").style.display = wifiOn ? "" : "none";
  if (wifiOn) {
    const w = [`<span class="lbl">Wi-Fi</span>`];
    if (wf.network) w.push(`<span class="k">network </span> <b>${esc(wf.network)}</b>`);
    if (wf.password) w.push(`<span class="k">password</span> <b>${esc(wf.password)}</b>`);
    $("wifi").innerHTML = w.join("\n");
  }
  $("thanks").textContent = CFG.thanks || "";
  renderTodos(true);
  computeLane();
}

let lastTodoKey = "";
function renderTodos(force) {
  const items = CFG.agenda || [];
  const now = nowMin();
  let cur = -1;
  items.forEach((it, i) => { if (toMin(it.time) <= now) cur = i; });
  const key = cur + "|" + items.length;
  if (!force && key === lastTodoKey) return;
  lastTodoKey = key;
  const width = Math.max(0, ...items.map((it) => it.label.length));
  const out = [`<div class="th"><span class="dot">⏺︎</span> Update Todos</div>`];
  items.forEach((it, i) => {
    const state = i < cur ? "done" : i === cur ? "now" : "todo";
    const box = state === "done" ? "☒" : "☐";
    const el = i === 0 ? "  ⎿  " : "     ";
    const tag = state === "now" ? `<span class="tag">${" ".repeat(width - it.label.length)}  ◂ now</span>` : "";
    out.push(`<div class="row ${state}" data-i="${i}"><span class="el">${el}</span><span class="bx">${box}</span> <span class="tx">${esc(it.time)}  ${esc(it.label)}</span>${tag}</div>`);
  });
  $("todos").innerHTML = out.join("");
}

// ---------------------------------------------------------------------------
// Animated things on the fx canvas: crabs, the big peeking crab, particles
// ---------------------------------------------------------------------------
const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));

// Draw one character centred in a terminal cell
function cellText(ctx, c, col, row, color) {
  const cw = S * DPR, ch = 2 * S * DPR;
  ctx.font = `700 ${Math.round(ch * 0.8)}px ui-monospace, "SF Mono", Menlo, monospace`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = color;
  ctx.fillText(c, col * cw + cw / 2, row * ch + ch / 2);
}

// A CCC crab scuttles sideways in bursts, stops to chat with crabs it meets, and flees the big crab
class Crab {
  constructor() {
    this.frame = 0; this.mode = "scuttle"; this.done = false;
    this.acc = ACCESSORIES[randInt(0, ACCESSORIES.length - 1)];
    this.chatTimer = 0; this.partner = null; this.cooldown = 0;
    this.right = Math.random() < 0.5;
    this.x = this.right ? -CRAB_W : cols;
    this.dx = rand(0.25, 0.5) * (this.right ? 1 : -1);
    this.y = randInt(lane.rowMin, lane.rowMax); this.vy = 0;
    this.paused = false; this.schedulePause();
  }
  schedulePause() { this.pauseTimer = randInt(20, 50); }
  resume() { this.mode = "scuttle"; this.partner = null; this.cooldown = 40; this.schedulePause(); }
  step() {
    this.frame++;
    if (this.mode === "flee") {
      this.x += this.dx; this.y -= 0.3;
      if (this.x < -CRAB_W - 2 || this.x > cols + 2) this.done = true;
      return;
    }
    if (this.mode === "chat") {
      if (--this.chatTimer <= 0) {
        // Chat over: swap accessories with the partner and move on
        if (this.partner && !this.partner.done) { [this.acc, this.partner.acc] = [this.partner.acc, this.acc]; this.partner.resume(); }
        this.resume();
      }
      return;
    }
    if (this.cooldown > 0) this.cooldown--;
    if (!this.paused) { if (--this.pauseTimer <= 0) { this.paused = true; this.pauseTimer = randInt(8, 20); } }
    else if (--this.pauseTimer <= 0) { this.paused = false; this.schedulePause(); this.vy = rand(-0.1, 0.1); }
    if (!this.paused) this.x += this.dx;
    this.y += this.vy; this.vy *= 0.95;
    this.y = Math.max(lane.rowMin, Math.min(lane.rowMax, this.y));
    if (this.x > cols + 2 || this.x < -CRAB_W - 2) this.done = true;
  }
  draw(ctx, t) {
    const legIdx = this.mode === "chat" ? 0 : Math.floor(this.frame / (this.mode === "flee" ? 2 : this.paused ? 8 : 5)) % 2;
    const lines = [...CRAB_BODY, CRAB_LEGS[legIdx]];
    const cw = S * DPR, ch = 2 * S * DPR, ix = Math.trunc(this.x), iy = Math.trunc(this.y);
    lines.forEach((line, r) => [...line].forEach((c, j) => fillCell(ctx, c, (ix + j) * cw, (iy + r) * ch, cw, ch, CRAB_COLOR)));
    if (this.acc && this.mode !== "chat") {
      const bob = Math.trunc(Math.sin(t * 2 + this.x) * 0.4);
      cellText(ctx, this.acc[0], ix + Math.floor(CRAB_W / 2), iy - 1 + bob, this.acc[1]);
    }
    if (this.mode === "chat") {
      const dots = Math.floor(this.frame / 10) % 2 === 0 ? "..." : " . ";
      [...dots].forEach((c, k) => { if (c !== " ") cellText(ctx, c, ix + Math.floor(CRAB_W / 2) - 1 + k, iy - 1, "rgb(208,208,208)"); });
    }
  }
}

// A big crab rises from the bottom of the screen, blinks a few times, then sinks back
class CrabPeek {
  constructor() {
    this.frame = 0; this.done = false;
    this.x = Math.floor((cols - BIG_CRAB_W) / 2) + randInt(-10, 10);
    this.y = rows; this.target = rows - BIG_CRAB_H + 2;
    this.phase = "rising"; this.peekUntil = 0; this.blinkUntil = 0; this.nextBlink = 0;
  }
  step() {
    this.frame++;
    if (this.phase === "rising") {
      this.y -= 0.15;
      if (this.y <= this.target) { this.y = this.target; this.phase = "peeking"; this.peekUntil = this.frame + 100; this.nextBlink = this.frame + randInt(15, 30); }
    } else if (this.phase === "peeking") {
      if (this.frame > this.peekUntil) this.phase = "sinking";
      if (this.frame >= this.nextBlink && this.blinkUntil <= this.frame) { this.blinkUntil = this.frame + randInt(3, 6); this.nextBlink = this.frame + randInt(15, 35); }
    } else {
      this.y += 0.15;
      if (this.y > rows) this.done = true;
    }
  }
  draw(ctx) {
    const sprite = this.phase === "peeking" && this.frame < this.blinkUntil ? BIG_CRAB_BLINK : BIG_CRAB_OPEN;
    const cw = S * DPR, ch = 2 * S * DPR, ix = Math.trunc(this.x), iy = Math.trunc(this.y);
    sprite.forEach((line, r) => [...line].forEach((c, j) => fillCell(ctx, c, (ix + j) * cw, (iy + r) * ch, cw, ch, CRAB_COLOR)));
  }
}

class Particle {
  constructor() {
    this.x = randInt(2, cols - 3); this.y = rows - 1; this.dx = rand(-0.3, 0.3); this.speed = rand(0.05, 0.15);
    this.color = WARM[randInt(0, WARM.length - 1)]; this.done = false;
  }
  step() { this.y -= this.speed; this.x += this.dx; if (this.y < 0) this.done = true; }
  draw(ctx) {
    const progress = 1 - this.y / rows;
    ctx.globalAlpha = progress > 0.7 ? 0.35 : progress > 0.3 ? 0.65 : 1;
    ctx.fillStyle = this.color;
    const cw = S * DPR, ch = 2 * S * DPR, d = Math.max(2, Math.round(S * 0.22 * DPR));
    ctx.fillRect(Math.round(Math.round(this.x) * cw + cw / 2 - d / 2), Math.round(Math.round(this.y) * ch + ch / 2 - d / 2), d, d);
    ctx.globalAlpha = 1;
  }
}

// ---------------------------------------------------------------------------
// Main tick: 80 ms, like the terminal version
// ---------------------------------------------------------------------------
let eggs = [], tick = 0, verbIdx = 0, lastVerb = 0, nextEgg = 0, nextMote = 0, goHomeIdx = 0, nextPeek = rand(90, 180);
const t0 = performance.now();

function frame() {
  const t = (performance.now() - t0) / 1000;
  tick++;
  if (tick % 25 === 0) computeLane();

  // Logo shimmer
  lgc.clearRect(0, 0, logo.width, logo.height);
  const cw = S * DPR, ch = 2 * S * DPR;
  TITLE.forEach((line, i) => [...line].forEach((c, j) => {
    if (c === " ") return;
    const sh = Math.sin(j * 0.3 + t * 0.4 + i * 0.5);
    fillCell(lgc, c, j * cw, i * ch, cw, ch, WARM[Math.floor(((sh + 1) / 2) * WARM.length) % WARM.length]);
  }));

  // Subtitle shimmer
  subChars.forEach((el, j) => {
    const sh = Math.sin(j * 0.4 + t * 0.3);
    el.style.color = WARM[Math.floor(((sh + 1) / 2) * WARM.length) % WARM.length];
  });

  // Agenda + go-home urgency
  const now = nowMin();
  renderTodos(false);
  const items = CFG.agenda || [];
  let urgency = 0, pastEnd = false;
  if (items.length) {
    const end = toMin(items[items.length - 1].time);
    const span = Math.max(1, CFG.urgency_start_minutes_before_end || 40);
    urgency = Math.max(0, (now - (end - span)) / span);
    pastEnd = now >= end;
    const last = document.querySelector(`#todos .row[data-i="${items.length - 1}"]`);
    if (last) {
      if (urgency > 0) {
        const speed = 0.6 + Math.min(urgency, 2) * 2.2;
        const pulse = (Math.sin(t * speed * Math.PI) + 1) / 2;
        last.style.opacity = String(0.55 + 0.45 * pulse);
        last.style.color = pastEnd ? `rgb(255,${Math.round(135 + 80 * pulse)},${Math.round(135 + 40 * pulse)})` : "";
      } else { last.style.opacity = ""; last.style.color = ""; }
    }
  }

  // Spinner line: rotating verbs, or go-home messages once the end time passes
  if (t - lastVerb > 8) {
    lastVerb = t;
    if (pastEnd) goHomeIdx = (goHomeIdx + 1) % CFG.go_home_messages.length;
    else verbIdx = (verbIdx + 1) % CFG.verbs.length;
  }
  const verb = (pastEnd ? CFG.go_home_messages[goHomeIdx] : CFG.verbs[verbIdx % CFG.verbs.length]) || "";
  $("verb").textContent = verb.replace(/\.\.\.$/, "…");
  $("verb").style.color = pastEnd ? "rgb(255,175,175)" : GLOW[Math.floor(((Math.sin(t * 0.5) + 1) / 2) * 3.999)];
  $("sg").textContent = SPINNER[Math.floor(tick / 2) % SPINNER.length];
  $("meta").textContent = `(${Math.floor(t - lastVerb)}s · esc to interrupt)`;

  // Clock
  $("hm").textContent = fmtHM(now);

  // Spawn: a crab straight away, then a crab (up to 5) or a puff of particles every 8–18 s, plus a slow trickle of motes
  const liveCrabs = eggs.filter((e) => e instanceof Crab && !e.done);
  if (t > nextEgg) {
    if (nextEgg === 0) { eggs.push(new Crab()); nextEgg = t + rand(5, 12); }
    else {
      if (Math.random() < 0.8 && liveCrabs.length < MAX_CRABS) eggs.push(new Crab());
      else for (let k = randInt(1, 3); k > 0; k--) eggs.push(new Particle());
      nextEgg = t + rand(8, 18);
    }
  }
  if (t > nextMote) { eggs.push(new Particle()); nextMote = t + rand(1.5, 4); }

  // Now and then a big crab peeks up from the bottom, and the small crabs flee
  if (t > nextPeek) {
    if (!eggs.some((e) => e instanceof CrabPeek && !e.done)) {
      eggs.unshift(new CrabPeek());
      liveCrabs.forEach((c) => { c.mode = "flee"; c.partner = null; c.dx = (c.x < cols / 2 ? -1 : 1) * rand(0.8, 1.5); });
    }
    nextPeek = t + rand(120, 240);
  }

  fxc.clearRect(0, 0, fx.width, fx.height);
  eggs.forEach((e) => { e.step(); if (!e.done) e.draw(fxc, t); });

  // Two scuttling crabs that meet stop for a chat
  const free = eggs.filter((e) => e instanceof Crab && !e.done && e.mode === "scuttle" && e.cooldown <= 0);
  for (let a = 0; a < free.length; a++) {
    const A = free[a]; if (A.mode !== "scuttle") continue;
    for (let b = a + 1; b < free.length; b++) {
      const B = free[b];
      if (B.mode === "scuttle" && Math.abs(A.x - B.x) < CRAB_W && Math.abs(A.y - B.y) < 3) {
        A.mode = B.mode = "chat"; A.chatTimer = B.chatTimer = randInt(30, 60); A.partner = B; B.partner = A;
        break;
      }
    }
  }
  eggs = eggs.filter((e) => !e.done);
}

// ---------------------------------------------------------------------------
// Config polling, wake lock, fullscreen
// ---------------------------------------------------------------------------
let cfgKey = "";
async function loadConfig() {
  try {
    const res = await fetch("config.json?ts=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const txt = await res.text();
    if (txt === cfgKey) return;
    cfgKey = txt;
    CFG = Object.assign({}, CFG, JSON.parse(txt));
    renderText();
  } catch (e) { /* offline: keep what we have */ }
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ("wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch (e) { wakeLock = null; }
  return !!wakeLock;
}
const nosleep = $("nosleep");
const videoAwake = () => !nosleep.paused && !nosleep.ended && nosleep.readyState > 2;
async function stayAwake() {
  if (nosleep.paused) { try { await nosleep.play(); } catch (e) { /* needs a tap first */ } }
  const ok = (await keepAwake()) || videoAwake();
  $("awake").style.display = ok ? "none" : "block";
  return ok;
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { stayAwake(); loadConfig(); } });
nosleep.addEventListener("playing", () => { $("awake").style.display = "none"; });
setInterval(stayAwake, 15000);

let toastTimer;
function toast(msg) {
  $("toast").textContent = msg; $("toast").classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $("toast").classList.remove("on"), 4000);
}
document.addEventListener("click", async () => {
  const el = document.documentElement;
  if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {});
  const ok = await stayAwake();
  toast(ok ? "✓ screen will stay awake" : "! set Auto-Lock to Never to keep the screen on");
});
document.addEventListener("keydown", (e) => {
  if (e.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
});

layout();
renderText();
loadConfig();
stayAwake();
setInterval(loadConfig, 60000);
setInterval(frame, 80);
frame();
</script>
